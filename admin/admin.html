<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <button class="sidebarbutton active" data-target="inbox"><i data-lucide="inbox"></i>Inbox</button>
        <button class="sidebarbutton" data-target="projects"><i data-lucide="briefcase"></i>
            Projects</button>
        <button class="sidebarbutton" data-target="videos"><i data-lucide="video"></i>Videos</button>
    </aside>

    <main class="main">
        <!--inbox-->
        <div id="inbox" class="section active">
            <h1>Collaboration Interest</h1>
            <div id="inboxlist" class="gridlist">Loading...</div>
        </div>

        <div id="projects" class="section">
            <h1>Add New Projects</h1>
            <div class="card">
                <form id="addproject">
                    <label>Project Title</label>
                    <input type="text" id="projecttitle" placeholdder="shiva kaushal's project" required>

                    <label>Live URL</label>
                    <input type="text" id="projectlink" placeholder="goole.com" required>

                    <label>Github url</label>
                    <input type="text" id="projectgithub" placeholder="github.com/shivakaushal" required>

                    <label>Project description</label>
                    <textarea type="text" id="projectdescription" placeholder="what I actually build? hehehehe"
                        required></textarea>

                    <button type="submit" class="submitbutton"><i data-lucide="plus"></i>Publish Project</button>
                </form>
            </div>
        </div>

        <div id="videos" class="section">
            <h1>Add Videos link</h1>
            <div class="card">
                <form id="addvideo">
                    <label>Video Title</label>
                    <input type="text" id="videotitle" placeholder="I become youngest billionaire, hehehehe" required>

                    <label>Embed Link</label>
                    <input type="text" id="videolink" placeholder="links.com, yt, ig, x any" required>

                    <button type="submit" class="submitbutton"><i data-lucide="plus"></i>Add video</button>
                </form>
            </div>
        </div>
    </main>

    <script src="/admin/admin.js" type="module"></script>
    <script>
        lucide.createIcons();

        const tabbutton = document.querySelectorAll('.sidebarbutton');
        const sections = document.querySelectorAll('.section');

        tabbutton.forEach(button => {
            button.addEventListener('click', () => {
                tabbutton.forEach(b => b.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));

                button.classList.add('active');
                const targetId = button.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>

</body>

</html>
